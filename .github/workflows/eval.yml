name: Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: 'Agent backend for manual eval'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - claude
          - codex
      real_agent:
        description: 'Invoke real local Claude/Codex instead of dry-run'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deterministic smoke and dry-run agent evals
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.real_agent != 'true' }}
        run: scripts/eval-suite.sh --backend "${{ github.event.inputs.backend || 'both' }}"
      - name: Real local agent eval
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.real_agent == 'true' }}
        run: scripts/eval-suite.sh --backend "${{ github.event.inputs.backend || 'both' }}" --real-agent
