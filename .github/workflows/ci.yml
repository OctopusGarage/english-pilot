name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
        if: matrix.os == 'ubuntu-latest'
      - run: shellcheck --severity=warning scripts/*.sh
        if: matrix.os == 'ubuntu-latest'
      - run: scripts/verify-systemd-unit.sh
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm run lint
      - run: pnpm run portable-fixtures
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run build
      - run: pnpm run smoke
      - run: pnpm run depcruise
      - run: pnpm run knip

  verify:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All matrix checks passed
        run: test "${{ needs.checks.result }}" = "success"
